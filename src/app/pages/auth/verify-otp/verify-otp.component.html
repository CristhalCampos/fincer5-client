<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 font-sans">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-md border border-slate-100 text-center">
    <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Verifica tu Identidad</h2>
    <p class="mt-2 text-sm text-slate-500 mb-8 leading-relaxed">
      Hemos enviado un código alfanumérico de 6 dígitos a: <br>
      <strong class="text-slate-700 font-semibold">{{ email }}</strong>
    </p>

    <form (ngSubmit)="onVerify()" #otpForm="ngForm" class="space-y-5 text-left">
      <div>
        <label for="code" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
          Código de Verificación
        </label>
        <input 
          type="text" 
          id="code" 
          name="code" 
          [(ngModel)]="code" 
          required 
          maxlength="6"
          placeholder="Ej: A8X3K2"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-center text-xl font-bold uppercase tracking-[0.25em] text-slate-800 placeholder-slate-300 outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          #codeInput="ngModel"
        />
        <div *ngIf="codeInput.invalid && codeInput.touched" class="mt-1.5 text-xs text-red-500 font-medium">
          El código es requerido.
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="otpForm.invalid || isLoading" 
        class="w-full rounded-lg bg-slate-900 py-3 font-semibold text-white transition-colors hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-100 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed shadow-lg shadow-slate-900/10"
      >
        {{ isLoading ? 'Verificando...' : 'Verificar y Entrar' }}
      </button>
    </form>

    <div class="mt-6 text-sm">
      <a (click)="backToLogin()" class="text-blue-600 hover:text-blue-700 font-medium cursor-pointer transition-colors">
        ← Volver a ingresar correo
      </a>
    </div>
  </div>
</div>
