<div class="flex min-h-screen items-center justify-center px-3 sm:px-4 lg:px-6 py-8 sm:py-12">
  <div class="w-full max-w-md sm:max-w-lg rounded-2xl bg-(--surface-color) p-6 sm:p-8 shadow-2xl border border-(--switch-border) text-center">
    
    <!-- Icono decorativo superior -->
    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-(--accent-color)/10 flex items-center justify-center mx-auto mb-6">
      <lucide-icon [img]="ShieldCheckIcon" class="w-7 h-7 sm:w-8 sm:h-8 text-(--accent-color)"></lucide-icon>
    </div>

    <!-- Título y correo -->
    <h2 class="rubik-title text-xl sm:text-2xl font-bold text-(--text-color) tracking-tight">
      Verifica tu Identidad
    </h2>
    <p class="mt-3 text-sm opacity-70 text-(--text-color) leading-relaxed">
      Hemos enviado un código de 6 dígitos a: <br>
      <strong class="text-(--accent-color) font-semibold mt-1 block">{{ email }}</strong>
    </p>

    <!-- Formulario -->
    <form (ngSubmit)="onVerify()" #otpForm="ngForm" class="space-y-6 text-left mt-8">
      
      <!-- Campo Código -->
      <div>
        <label for="code" class="block text-xs font-semibold text-(--text-color) uppercase tracking-wider mb-1.5">
          Código de Verificación
        </label>
        <input
          type="text"
          id="code"
          name="code"
          [(ngModel)]="code"
          (input)="onCodeInput($event)"
          required
          maxlength="6"
          placeholder="Ej: a8x3k2"
          class="w-full rounded-lg border border-(--switch-border) bg-(--bg-color) px-4 py-3 text-center text-xl font-bold tracking-[0.25em] text-(--text-color) placeholder:opacity-30 outline-none transition-all focus:border-(--accent-color) focus:ring-2 focus:ring-(--accent-color)/20 min-h-[48px]"
          #codeInput="ngModel"
          autocomplete="one-time-code"
          inputmode="text"
        />
        
        <!-- Mensaje de error -->
        <div *ngIf="codeInput.invalid && codeInput.touched" class="mt-1.5 text-xs text-red-500 font-medium flex items-center gap-1 justify-center">
          <lucide-icon [img]="AlertCircleIcon" class="w-3 h-3"></lucide-icon>
          <span>El código es requerido.</span>
        </div>
      </div>

      <!-- Botón Principal -->
      <button
        type="submit"
        [disabled]="otpForm.invalid || isLoading"
        class="btn-primary w-full py-3.5 text-base flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed min-h-[48px]"
      >
        <lucide-icon
          [img]="LoaderIcon"
          class="w-5 h-5 animate-spin"
          *ngIf="isLoading"
        ></lucide-icon>
        <span>{{ isLoading ? 'Verificando...' : 'Verificar y Entrar' }}</span>
      </button>
    </form>

    <!-- Link para volver -->
    <div class="mt-6">
      <a
        (click)="backToLogin()"
        class="inline-flex items-center justify-center gap-1 text-sm text-(--text-color) opacity-70 hover:opacity-100 hover:text-(--accent-color) font-medium cursor-pointer transition-colors min-h-[44px] px-2"
      >
        <lucide-icon [img]="ArrowLeftIcon" class="w-4 h-4"></lucide-icon>
        Volver a ingresar correo
      </a>
    </div>

  </div>
</div>
