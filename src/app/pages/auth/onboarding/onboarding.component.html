<div class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-2xl rounded-2xl bg-(--surface-color) p-8 md:p-12 shadow-2xl border border-(--switch-border) flex flex-col justify-between min-h-[600px]">
    
    <!-- Header: Progreso -->
    <div>
      <div class="flex justify-between items-end text-xs font-bold uppercase tracking-wider text-(--text-color) opacity-60 mb-2">
        <div>
          <span>Paso {{ currentStep.id }} de {{ steps.length }}</span>
          <p class="text-[10px] text-(--accent-color) font-semibold lowercase mt-0.5" *ngIf="currentStep.id === steps.length">Paso final</p>
        </div>
        <span class="text-sm font-bold text-(--text-color)">{{ progressPercentage }}%</span>
      </div>
      <div class="h-1.5 w-full bg-(--bg-color) rounded-full overflow-hidden mb-10 border border-(--switch-border)">
        <div
          class="h-full bg-(--accent-color) transition-all duration-500 ease-out"
          [style.width.%]="progressPercentage"
        ></div>
      </div>
    </div>

    <!-- Contenido del Paso -->
    <div class="text-center my-auto">
      <!-- Icono principal del paso -->
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-(--accent-color)/10 text-(--accent-color) mb-6">
        <lucide-icon [img]="currentStep.icon" class="w-8 h-8"></lucide-icon>
      </div>

      <h2 class="rubik-title text-2xl md:text-3xl font-bold tracking-tight leading-tight max-w-xl mx-auto text-(--text-color)">
        {{ currentStep.title }}
      </h2>
      <p class="mt-3 text-sm md:text-base opacity-70 max-w-md mx-auto leading-relaxed text-(--text-color)" *ngIf="currentStep.subtitle">
        {{ currentStep.subtitle }}
      </p>

      <!-- Opciones -->
      <div class="mt-8 max-w-md mx-auto space-y-3">
        <div
          *ngFor="let option of currentStep.options"
          (click)="selectOption(option.value)"
          [ngClass]="{
            'border-(--accent-color) bg-(--accent-color)/5 ring-1 ring-(--accent-color)': responses[currentStep.key] === option.value,
            'border-(--switch-border) bg-(--bg-color) hover:border-(--accent-color)/50': responses[currentStep.key] !== option.value
          }"
          class="flex items-center justify-between border rounded-xl px-5 py-4 cursor-pointer transition-all group"
        >
          <div class="flex items-center gap-4 text-left">
            <div class="w-10 h-10 rounded-lg bg-(--surface-color) border border-(--switch-border) flex items-center justify-center text-(--accent-color) group-hover:border-(--accent-color)/50 transition-colors">
              <lucide-icon [img]="option.icon || currentStep.icon" class="w-5 h-5"></lucide-icon>
            </div>
            <div>
              <span class="block text-sm font-semibold text-(--text-color) group-hover:text-(--accent-color) transition-colors">
                {{ option.label }}
              </span>
              <span class="block text-xs opacity-60 text-(--text-color) mt-0.5" *ngIf="option.sublabel">
                {{ option.sublabel }}
              </span>
            </div>
          </div>
          
          <!-- Radio Button Custom -->
          <div
            [ngClass]="{
              'border-(--accent-color) bg-(--accent-color)': responses[currentStep.key] === option.value,
              'border-(--switch-border) bg-transparent': responses[currentStep.key] !== option.value
            }"
            class="h-5 w-5 rounded-full border-2 flex items-center justify-center transition-all shrink-0"
          >
            <lucide-icon
              [img]="CheckIcon"
              class="w-3 h-3 text-white"
              *ngIf="responses[currentStep.key] === option.value"
            ></lucide-icon>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer: Navegación -->
    <div class="flex items-center justify-between mt-10 pt-6 border-t border-(--switch-border)">
      <button
        (click)="prevStep()"
        [disabled]="currentStepIndex === 0 || isLoading"
        class="px-6 py-3 font-medium text-sm text-(--text-color) opacity-60 hover:opacity-100 disabled:opacity-0 transition-all flex items-center gap-1"
      >
        ← Anterior
      </button>

      <button
        (click)="nextStep()"
        [disabled]="!isStepValid() || isLoading"
        class="btn-primary px-8 py-3 text-sm flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <lucide-icon
          [img]="LoaderIcon"
          class="w-4 h-4 animate-spin"
          *ngIf="isLoading && currentStepIndex === steps.length - 1"
        ></lucide-icon>
        <span>
          {{ currentStepIndex === steps.length - 1 ? (isLoading ? 'Guardando configuración...' : 'Finalizar y entrar') : 'Continuar →' }}
        </span>
      </button>
    </div>

  </div>
</div>
