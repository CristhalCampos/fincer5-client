<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 font-sans text-slate-800">
  <div class="w-full max-w-2xl rounded-2xl bg-white p-8 md:p-12 shadow-xl border border-slate-100 flex flex-col justify-between min-h-137.5">
    
    <div>
      <div class="flex justify-between items-end text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
        <div>
          <span>Paso {{ currentStep.id }} de {{ steps.length }}</span>
          <p class="text-[10px] text-blue-500 font-semibold lowercase mt-0.5" *ngIf="currentStep.id === 7">Paso final</p>
        </div>
        <span class="text-sm font-bold text-slate-700">{{ progressPercentage }}%</span>
      </div>
      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden mb-10">
        <div class="h-full bg-slate-900 transition-all duration-300" [style.width.%]="progressPercentage"></div>
      </div>
    </div>

    <div class="text-center my-auto">
      <div *ngIf="currentStep.icon" class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-slate-100 text-xl mb-6 shadow-sm">
        {{ currentStep.icon }}
      </div>

      <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight leading-tight max-w-xl mx-auto">
        {{ currentStep.title }}
      </h2>
      <p class="mt-3 text-sm md:text-base text-slate-400 max-w-md mx-auto leading-relaxed" *ngIf="currentStep.subtitle">
        {{ currentStep.subtitle }}
      </p>

      <div class="mt-8 max-w-md mx-auto space-y-3">
        <div 
          *ngFor="let option of currentStep.options"
          (click)="selectOption(option.value)"
          [ngClass]="{
            'border-slate-900 bg-slate-50 ring-2 ring-slate-900/5 font-semibold': responses[currentStep.key] === option.value,
            'border-slate-200 hover:border-slate-300 bg-white': responses[currentStep.key] !== option.value
          }"
          class="flex items-center justify-between border rounded-2xl px-6 py-4 cursor-pointer transition-all shadow-sm group"
        >
          <div class="flex items-center gap-3">
            <span *ngIf="option.icon" class="text-lg">{{ option.icon }}</span>
            <span class="text-sm text-slate-700 group-hover:text-slate-900">{{ option.label }}</span>
          </div>
          <div 
            [ngClass]="{'border-slate-900 bg-slate-900': responses[currentStep.key] === option.value, 'border-slate-300': responses[currentStep.key] !== option.value}"
            class="h-5 w-5 rounded-full border-2 flex items-center justify-center transition-colors"
          >
            <div class="h-2 w-2 rounded-full bg-white" *ngIf="responses[currentStep.key] === option.value"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mt-10 pt-6 border-t border-slate-100">
      <button 
        (click)="prevStep()"
        [disabled]="currentStepIndex === 0 || isLoading"
        class="px-6 py-3 font-medium text-sm text-slate-500 hover:text-slate-800 disabled:opacity-0 transition-opacity"
      >
        ← Anterior
      </button>

      <button 
        (click)="nextStep()"
        [disabled]="responses[currentStep.key] === null || isLoading"
        class="rounded-xl bg-slate-900 px-8 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-900/20 transition-all hover:bg-slate-800 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed flex items-center gap-2"
      >
        <span *ngIf="isLoading && currentStepIndex === steps.length - 1" class="h-4 w-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        {{ currentStepIndex === steps.length - 1 ? (isLoading ? 'Guardando...' : 'Finalizar configuración') : 'Continuar →' }}
      </button>
    </div>

  </div>
</div>
