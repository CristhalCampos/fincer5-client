<div class="flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-md rounded-2xl bg-(--surface-color) p-8 shadow-2xl border border-(--switch-border) text-center">
    
    <!-- Título -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-(--text-color) mt-4">
        Iniciar Sesión
      </h2>
      <p class="mt-2 text-sm opacity-70 text-(--text-color)">
        Ingresa tu correo para recibir un código de acceso único.
      </p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-5 text-left">
      
      <!-- Campo Email -->
      <div>
        <label for="email" class="block text-xs font-semibold text-(--text-color) uppercase tracking-wider mb-1.5">
          Correo Electrónico
        </label>
        <div class="relative">
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            placeholder="ejemplo@correo.com"
            class="w-full rounded-lg border border-(--switch-border) bg-(--bg-color) px-4 py-2.5 text-(--text-color) placeholder:opacity-50 outline-none transition-all focus:border-(--accent-color) focus:ring-2 focus:ring-(--accent-color)/20"
            #emailInput="ngModel"
          />
          <lucide-icon
            [img]="MailIcon"
            class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-(--text-color) opacity-40 pointer-events-none"
          ></lucide-icon>
        </div>
        
        <!-- Mensaje de error -->
        <div *ngIf="emailInput.invalid && emailInput.touched" class="mt-1.5 text-xs text-red-500 font-medium">
          Por favor, ingresa un correo válido.
        </div>
      </div>

      <!-- Botón Principal -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="btn-primary w-full py-3 text-base flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <lucide-icon
          [img]="LoaderIcon"
          class="w-5 h-5 animate-spin"
          *ngIf="isLoading"
        ></lucide-icon>
        <span>{{ isLoading ? 'Enviando código...' : 'Continuar con correo' }}</span>
      </button>
    </form>

    <!-- Separador -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-(--switch-border)"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="bg-(--surface-color) px-3 text-(--text-color) opacity-60">ó</span>
      </div>
    </div>

    <!-- Botón Google -->
    <button
      (click)="loginWithGoogle()"
      [disabled]="isLoading"
      class="w-full rounded-lg border border-(--switch-border) bg-(--bg-color) py-3 font-medium text-(--text-color) transition-all hover:border-(--accent-color) hover:text-(--accent-color) focus:outline-none focus:ring-2 focus:ring-(--accent-color)/20 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3"
    >
      <!-- <img src="assets/google-icon.svg" alt="Google" class="w-5 h-5" *ngIf="!isLoading" /> -->
      <span>Continuar con Google</span>
    </button>

    <!-- Link de ayuda -->
    <p class="mt-6 text-xs opacity-60 text-(--text-color)">
      ¿Problemas para iniciar sesión?
      <a routerLink="/contact" class="text-(--accent-color) font-semibold hover:underline">
        Contáctanos
      </a>
    </p>
  </div>
</div>
