<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 font-sans">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-md border border-slate-100 text-center">
    <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Iniciar Sesión en Fincer5</h2>
    <p class="mt-2 text-sm text-slate-500 mb-8">
      Ingresa tu correo para recibir un código de acceso único.
    </p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-5 text-left">
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
          Correo Electrónico
        </label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          email
          placeholder="ejemplo@correo.com"
          class="w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-800 placeholder-slate-400 outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          #emailInput="ngModel"
        />
        <div *ngIf="emailInput.invalid && emailInput.touched" class="mt-1.5 text-xs text-red-500 font-medium">
          Por favor, ingresa un correo válido.
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="loginForm.invalid || isLoading" 
        class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white transition-colors hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-100 disabled:bg-blue-300 disabled:cursor-not-allowed"
      >
        {{ isLoading ? 'Enviando...' : 'Continuar con correo' }}
      </button>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-200"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="bg-white px-3 text-slate-400">ó</span>
      </div>
    </div>

    <button 
      (click)="loginWithGoogle()" 
      class="flex w-full items-center justify-center gap-3 rounded-lg border border-slate-300 bg-white py-3 font-medium text-slate-700 transition-colors hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100 disabled:opacity-50"
      [disabled]="isLoading"
    >
      <img src="assets/google-icon.svg" alt="Google" class="w-5 h-5" *ngIf="!isLoading" />
      <span>Continuar con Google</span>
    </button>
  </div>
</div>
