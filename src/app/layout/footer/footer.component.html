              Inicio
            </a>
          </li>
          <li>
            <a routerLink="/about" class="text-sm opacity-70 hover:opacity-100 hover:text-(--accent-color) transition-all text-(--text-color)">
              Nosotros
            </a>
          </li>
          <li>
            <a routerLink="/faq" class="text-sm opacity-70 hover:opacity-100 hover:text-(--accent-color) transition-all text-(--text-color)">
              FAQ
            </a>
          </li>
          <li>
            <a routerLink="/contact" class="text-sm opacity-70 hover:opacity-100 hover:text-(--accent-color) transition-all text-(--text-color)">
              Contacto
            </a>
          </li>
        </ul>
      </div>

      <!-- Columna 3: Legal y Contacto -->
      <div>
        <h3 class="rubik-title font-bold text-(--text-color) mb-4">Legal</h3>
        <ul class="space-y-2 mb-6">

              Términos y Condiciones

          <li>

              Política de Privacidad

        <a href="mailto:info@fincer5.com" class="flex items-center gap-2 text-sm opacity-70 hover:opacity-100 hover:text-(--accent-color) transition-all text-(--text-color)">
          <lucide-icon [img]="MailIcon" class="w-4 h-4"></lucide-icon>
