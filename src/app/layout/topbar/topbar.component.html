<header class="h-16 bg-(--surface-color) border-b border-(--switch-border) flex items-center justify-between px-4 lg:px-8 sticky top-0 z-30 shrink-0">
  
  <!-- Izquierda: Botón Hamburguesa (Solo Móvil/Tablet) -->
  <button class="lg:hidden p-2 rounded-lg hover:bg-(--bg-color)" (click)="openSidebar.emit()" aria-label="Abrir menú">
    <lucide-icon [img]="MenuIcon" class="w-6 h-6 text-(--text-color)"></lucide-icon>
  </button>

  <!-- Izquierda: Título de la sección (Opcional, para Desktop) -->
  <div class="hidden lg:flex items-center gap-2 text-sm text-(--text-color) opacity-60">
    <span>Panel de Control</span>
  </div>

  <!-- Derecha: Menú de Usuario -->
  <div class="relative">
    <button 
      (click)="toggleUserMenu()"
      class="flex items-center gap-2 px-3 py-2 rounded-full hover:bg-(--bg-color) transition-colors"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <div class="w-8 h-8 rounded-full bg-(--accent-color)/10 flex items-center justify-center text-(--accent-color) font-bold text-sm">
        {{ userInitial() }}
      </div>
      <span class="hidden sm:inline text-sm font-medium text-(--text-color)">{{ userName() }}</span>
      <lucide-icon [img]="ChevronDownIcon" class="w-4 h-4 text-(--text-color) opacity-70"></lucide-icon>
    </button>

    <!-- Dropdown -->
    @if (isMenuOpen()) {
      <div class="absolute right-0 top-full mt-2 w-56 bg-(--surface-color) border border-(--switch-border) rounded-xl shadow-xl py-2 z-50 animate-in fade-in-0 zoom-in-95 duration-150">
        <div class="px-4 py-3 border-b border-(--switch-border) sm:hidden">
          <p class="text-sm font-semibold text-(--text-color) truncate">{{ userName() }}</p>
          <p class="text-xs opacity-60 text-(--text-color) truncate">{{ userEmail() }}</p>
        </div>
        
        <a routerLink="/dashboard/profile" (click)="closeMenu()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-(--text-color) opacity-70 hover:bg-(--bg-color) hover:opacity-100 transition-colors">
          <lucide-icon [img]="UserIcon" class="w-4 h-4 shrink-0"></lucide-icon>
          <span>Mi Perfil</span>
        </a>
        
        <a routerLink="/dashboard/settings" (click)="closeMenu()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-(--text-color) opacity-70 hover:bg-(--bg-color) hover:opacity-100 transition-colors">
          <lucide-icon [img]="SettingsIcon" class="w-4 h-4 shrink-0"></lucide-icon>
          <span>Configuración</span>
        </a>
        
        <hr class="my-2 border-(--switch-border)">
        
        <button (click)="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-500 hover:bg-red-500/10 transition-colors">
          <lucide-icon [img]="LogOutIcon" class="w-4 h-4 shrink-0"></lucide-icon>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    }
  </div>
</header>
