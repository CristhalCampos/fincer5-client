<div class="flex min-h-screen bg-(--bg-color) text-(--text-color) font-sans relative">
  
  <!-- Overlay oscuro para móvil -->
  @if (isSidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm transition-opacity"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- 1. Barra Lateral -->
  <app-sidebar
    [isOpen]="isSidebarOpen()"
    [userName]="userName()"
    [userEmail]="userEmail()"
    [userInitial]="userInitial()"
    (closeSidebar)="closeSidebar()"
  />

  <!-- 2. Área Principal -->
  <main class="flex-1 flex flex-col min-w-0 transition-all duration-300">
    
    <!-- Barra Superior -->
    <app-topbar
      [userName]="userName()"
      [userEmail]="userEmail()"
      [userInitial]="userInitial()"
      (openSidebar)="openSidebar()"
    />

    <!-- 3. Contenido de las Rutas Hijas -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </div>
    
  </main>
</div>
